name: Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target LM18_ADT_VST3 --parallel 4
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter 'LM18 ADT.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle not found' }
          Compress-Archive -Path $plugin.FullName -DestinationPath ADT-V0.4-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ADT-V0.4-Windows
          path: ADT-V0.4-Windows.zip
